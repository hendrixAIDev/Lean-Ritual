<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · 薄肌日课</title>
<style>
:root{--bg:#F4F1EA;--surface:#FFFDF8;--ink:#1F1D1A;--muted:#6B655C;--line:#DDD6C8;--accent:#B5462F;--bad:#A83A3A;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#161513;--surface:#201E1B;--ink:#EEE9DF;--muted:#A39C90;--line:#38342E;--accent:#E07A5F;--bad:#E77B7B;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:15px;line-height:1.55}
main{max-width:380px;margin:0 auto;padding:56px 16px}
h1{font-size:24px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--accent);font-weight:700}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button.primary{padding:11px;border:none;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <h1>Lean Ritual · 薄肌日课</h1>
  <p>每天的训练、饮食和体重，一个地方记下来。</p>
  <form class="card" id="f">
    <div class="tabs" id="tabs"><button type="button" data-m="login">登录</button><button type="button" data-m="register">凭邀请注册</button></div>
    <label id="nw" hidden>称呼<input id="n" maxlength="80" autocomplete="nickname"></label>
    <label id="ew">邮箱<input id="e" type="email" autocomplete="email" required autocapitalize="off"></label>
    <label id="pw">密码<input id="p" type="password" autocomplete="current-password" required minlength="12" maxlength="200"></label>
    <label id="iw" hidden>邀请码<input id="i" autocomplete="off"></label>
    <p class="err" id="err" role="status" aria-live="polite"></p>
    <button class="primary" id="go">登录</button>
    <button type="button" id="forgot">忘记密码</button>
    <button type="button" id="resend">重新发送验证邮件</button>
    <p class="hint">仅受邀邮箱可以注册。密码至少 12 位；完成邮箱验证后才能登录。<a href="/privacy.html">隐私说明</a></p>
  </form>
</main>
<script>
(function(){
  const $ = s => document.querySelector(s), params = new URLSearchParams(location.search);
  let mode = params.has("token") ? "reset" : params.has("invite") ? "register" : "login";
  if(params.has("invite")) $("#i").value=params.get("invite");
  if(params.has("email")) $("#e").value=params.get("email");
  const labels={login:"登录",register:"注册并发送验证邮件",reset:"设置新密码",forgot:"发送密码重置邮件",resend:"发送验证邮件"};
  function setMode(m){
    mode=m; $("#nw").hidden=m!=="register"; $("#iw").hidden=m!=="register";
    $("#pw").hidden=["forgot","resend"].includes(m); $("#p").required=!$("#pw").hidden;
    $("#ew").hidden=m==="reset"; $("#e").required=m!=="reset";
    $("#p").autocomplete=m==="login"?"current-password":"new-password";
    $("#go").textContent=labels[m]; $("#err").textContent="";
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  }
  $("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m)};
  $("#forgot").onclick=()=>setMode("forgot"); $("#resend").onclick=()=>setMode("resend");
  setMode(mode);
  if(params.has("error")) $("#err").textContent="链接无效或已过期，请重新发送邮件。";
  $("#f").onsubmit=async e=>{
    e.preventDefault(); $("#go").disabled=true; $("#err").textContent="";
    const email=$("#e").value.trim(), password=$("#p").value;
    const routes={login:"sign-in/email",register:"sign-up/email",forgot:"request-password-reset",reset:"reset-password",resend:"send-verification-email"};
    let body={email,password};
    if(mode==="register")body={...body,name:$("#n").value.trim()||email.split("@")[0],invitation:$("#i").value.trim(),callbackURL:"/login.html?verified=1"};
    if(mode==="forgot")body={email,redirectTo:"/login.html"};
    if(mode==="reset")body={token:params.get("token"),newPassword:password};
    if(mode==="resend")body={email,callbackURL:"/login.html?verified=1"};
    try{
      const r=await fetch("/api/auth/"+routes[mode],{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw Error(j.message||"请求失败，请稍后再试。");
      if(mode==="login"){location.replace("/");return}
      if(mode==="reset"){history.replaceState(null,"","/login.html");setMode("login");$("#err").textContent="密码已更新，请重新登录。"}
      else $("#err").textContent=mode==="register"?"请查收验证邮件，验证后再登录。":"如果邮箱符合条件，邮件会发送到你的邮箱。请检查垃圾邮件。";
    }catch(err){$("#err").textContent=err.message||"连不上服务器。"}finally{$("#go").disabled=false}
  };
})();
</script>
</body>
</html>
