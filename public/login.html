<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050A08" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050A08" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="薄肌日课">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<title>登录 · 薄肌日课</title>
<link rel="preload" href="/landing/fonts/serif-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site/theme.css">
<link rel="stylesheet" href="/site/login.css">
<script src="/client-errors.js" referrerpolicy="no-referrer"></script>
<script src="/site/phone-rules.js" defer blocking="render"></script>
<script src="/site/login.js" defer blocking="render"></script>
</head>
<body>
<main>
  <div class="top-row">
    <h1 id="title-h1">Lean Ritual · 薄肌日课</h1>
    <div class="lang-sw" id="lang-switch" role="group" aria-label="语言">
      <button type="button" data-lang="zh" class="on">中文</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </div>
  <p id="subtitle">每天的训练、饮食和体重，一个地方记下来。</p>
  <p class="banner" id="banner" role="status" aria-live="polite" hidden></p>
  <form class="card" id="f">
    <div class="tabs" id="tabs"><button type="button" data-m="login">登录</button><button type="button" data-m="register">凭邀请注册</button></div>
    <div class="method-sw" id="method-tabs" role="group" aria-label="登录方式"><button type="button" data-method="email" class="on" aria-pressed="true">邮箱</button><button type="button" data-method="phone" aria-pressed="false">手机号</button></div>
    <label id="nw" hidden><span id="lbl-n">称呼</span><input id="n" maxlength="80" autocomplete="nickname"></label>
    <label id="ew"><span id="lbl-e">邮箱</span><input id="e" type="email" inputmode="email" autocomplete="email" required autocapitalize="off" spellcheck="false"></label>
    <div class="phone-field" id="phw" role="group" aria-labelledby="lbl-ph" hidden><label class="field-label" id="lbl-ph" for="ph">手机号</label><div class="phone-row"><select id="cc" autocomplete="tel-country-code" aria-label="国家或地区代码" hidden></select><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="138 0013 8000 或 +国家代码" autocapitalize="off" spellcheck="false"></div></div>
    <label id="pw"><span id="lbl-p">密码</span><input id="p" type="password" autocomplete="current-password" required minlength="8" maxlength="200"></label>
    <label id="iw" hidden><span id="lbl-i">邀请码</span><input id="i" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="consent-box" id="cw" hidden>
      <label class="checkline" for="c-terms"><input id="c-terms" type="checkbox"><span><span id="c-terms-pre">我已满 18 周岁，阅读并同意</span><a id="c-terms-link" href="/terms.html" target="_blank" rel="noopener">使用条款</a><span id="c-terms-mid">和</span><a id="c-privacy-link" href="/privacy.html" target="_blank" rel="noopener">隐私说明</a><span id="c-terms-post">（版本 2026-11-25；含账号事务性邮件通过 Resend 发送，Resend 接收你的邮箱地址、验证/重置邮件内容及必要投递信息，处理地区依其配置与政策而定）。</span></span></label>
      <label class="checkline" for="c-sensitive"><input id="c-sensitive" type="checkbox"><span id="lbl-c-sensitive">我单独同意按隐私说明（版本 2026-11-25）所述目的，处理我的健康/身体数据、训练饮食记录及餐食照片等敏感个人信息，并同意如下接收方与范围：（1）阿里云美国西部（硅谷）主机：存储与处理全部账号及应用记录；（2）AI 请求（仅在服务端启用且你主动使用 AI 时）：你提交的 AI 提示文字与餐食照片将按服务器配置由 Google Gemini API 直接处理，或经 OpenRouter（作为配置的主通道，或在 Gemini 主通道临时故障、限流或超时时作为自动备用通道）转发至底层模型供应商；经 OpenRouter 转发时还会附带经 HMAC 派生的假名化用户标识，各 AI 供应商的计费档位与处理地区以服务端项目配置及各自政策为准。</span></label>
    </div>
    <p class="info-box" id="phone-forgot-msg" role="status" aria-live="polite" hidden>请联系邀请你的人重置密码</p>
    <p class="err" id="err" role="status" aria-live="polite"></p>
    <button type="button" id="reload-policy" hidden>刷新页面查看最新版本</button>
    <button class="primary" id="go">登录</button>
    <button type="button" id="forgot">忘记密码</button>
    <button type="button" id="resend">重新发送验证邮件</button>
    <p class="hint"><span id="hint-text">仅受邀邮箱可以注册。密码至少 8 位；完成邮箱验证后才能登录。</span><span class="hint-links"><a id="terms-link" href="/terms.html">使用条款</a><a id="privacy-link" href="/privacy.html">隐私说明</a><a id="help-link" href="mailto:hendrix.ai.dev@gmail.com?subject=Lean%20Ritual%20%E7%99%BB%E5%BD%95%E5%8F%8D%E9%A6%88">无法登录？发邮件反馈</a></span></p>
  </form>
</main>
</body>
</html>
