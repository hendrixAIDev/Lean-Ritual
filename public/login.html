<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · 薄肌日课</title>
<style>
:root{--bg:#F4F1EA;--surface:#FFFDF8;--ink:#1F1D1A;--muted:#6B655C;--line:#DDD6C8;--accent:#B5462F;--bad:#A83A3A;--ok:#2E6B4E;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#161513;--surface:#201E1B;--ink:#EEE9DF;--muted:#A39C90;--line:#38342E;--accent:#E07A5F;--bad:#E77B7B;--ok:#6EC29B;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:15px;line-height:1.55}
main{max-width:380px;margin:0 auto;padding:56px 16px}
h1{font-size:24px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 4px}
.top-row h1{margin:0}
.lang-sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex-shrink:0}
.lang-sw button{border:none;background:none;color:var(--muted);padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.lang-sw button.on{background:var(--accent);color:#fff;font-weight:700}
.banner{margin:0 0 12px;padding:10px 12px;border:1px solid var(--ok);border-radius:8px;background:var(--surface);color:var(--ok);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--accent);font-weight:700}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button.primary{padding:11px;border:none;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <div class="top-row">
    <h1 id="title-h1">Lean Ritual · 薄肌日课</h1>
    <div class="lang-sw" id="lang-switch" role="group" aria-label="语言">
      <button type="button" data-lang="zh" class="on">中文</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </div>
  <p id="subtitle">每天的训练、饮食和体重，一个地方记下来。</p>
  <p class="banner" id="banner" role="status" aria-live="polite" hidden></p>
  <form class="card" id="f">
    <div class="tabs" id="tabs"><button type="button" data-m="login">登录</button><button type="button" data-m="register">凭邀请注册</button></div>
    <label id="nw" hidden><span id="lbl-n">称呼</span><input id="n" maxlength="80" autocomplete="nickname"></label>
    <label id="ew"><span id="lbl-e">邮箱</span><input id="e" type="email" autocomplete="email" required autocapitalize="off"></label>
    <label id="pw"><span id="lbl-p">密码</span><input id="p" type="password" autocomplete="current-password" required minlength="8" maxlength="200"></label>
    <label id="iw" hidden><span id="lbl-i">邀请码</span><input id="i" autocomplete="off"></label>
    <p class="err" id="err" role="status" aria-live="polite"></p>
    <button class="primary" id="go">登录</button>
    <button type="button" id="forgot">忘记密码</button>
    <button type="button" id="resend">重新发送验证邮件</button>
    <p class="hint"><span id="hint-text">仅受邀邮箱可以注册。密码至少 8 位；完成邮箱验证后才能登录。</span><a id="privacy-link" href="/privacy.html">隐私说明</a></p>
  </form>
</main>

    for (const part of s.split("&")) {

    const dict = I18N[curLang] || I18N.zh;

  function authErrorKey(j, status){

    if(code === "VALIDATION_ERROR"){
      if(/\bemail\b/i.test(rawMsg)) return "err.INVALID_EMAIL";

    setTxt("#lbl-e", "field.email");
    setTxt("#lbl-p", "field.password");
    setTxt("#lbl-i", "field.invite");
    setTxt("#forgot", "btn.forgot");
    setTxt("#resend", "btn.resend");
    setTxt("#hint-text", "hint.body");
    setTxt("#privacy-link", "hint.privacy");
    if ($("#go")) $("#go").textContent = t("go." + mode);
    if (errKey) setErr(errKey);
    if (bannerKey) setBanner(bannerKey);
  }
  function setLang(next){
    const l = validLang(next);
    if (!l) return;
    curLang = l;
    markExplicitLang(l);
    applyLangUI();
  }
  function setMode(m){
    mode=m; $("#nw").hidden=m!=="register"; $("#iw").hidden=m!=="register";
    $("#pw").hidden=["forgot","resend"].includes(m); $("#p").required=!$("#pw").hidden;
    $("#ew").hidden=m==="reset"; $("#e").required=m!=="reset";
    $("#p").autocomplete=m==="login"?"current-password":"new-password";
    $("#go").textContent=t("go." + m); setErr(null); clearBanner();
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  }
  const lsw = $("#lang-switch");
  if (lsw) lsw.onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.lang) setLang(b.dataset.lang); };
  $("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m)};
  $("#forgot").onclick=()=>setMode("forgot"); $("#resend").onclick=()=>setMode("resend");
  applyLangUI();
  setMode(mode);
  if(params.has("error")) setErr(params.get("error")==="TOKEN_EXPIRED"?"err.TOKEN_EXPIRED":"err.INVALID_TOKEN");
  let cleanURL=false;
  if(params.has("verified")){
    if(params.get("verified")==="1"&&!params.has("error")) setBanner("banner.verified");
    params.delete("verified"); cleanURL=true;
  }
  if(params.has("deleted")){
    if(params.get("deleted")==="1"&&!params.has("error")) setBanner("banner.deleted");
    params.delete("deleted"); cleanURL=true;
  }
  if(cleanURL){
    const q=params.toString();
    history.replaceState(null,"",(location.pathname||"/login.html")+(q?"?"+q:"")+(location.hash||""));
  }
  $("#f").onsubmit=async e=>{
    e.preventDefault(); $("#go").disabled=true; setErr(null); clearBanner();
    const email=$("#e").value.trim(), password=$("#p").value;
    const routes={login:"sign-in/email",register:"sign-up/email",forgot:"request-password-reset",reset:"reset-password",resend:"send-verification-email"};
    let body={email,password};
    if(mode==="register")body={...body,name:$("#n").value.trim()||email.split("@")[0],invitation:$("#i").value.trim(),callbackURL:"/login.html?verified=1"};
    if(mode==="forgot")body={email,redirectTo:"/login.html"};
    if(mode==="reset")body={token:params.get("token"),newPassword:password};
    if(mode==="resend")body={email,callbackURL:"/login.html?verified=1"};
    try{
      let r;
      try{r=await fetch("/api/auth/"+routes[mode],{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-Ritual-Lang":curLang},body:JSON.stringify(body)});}
      catch{setErr("msg.network");return}
      const j=await r.json().catch(()=>({}));
      if(!r.ok){setErr(authErrorKey(j,r.status));return}
      if(mode==="login"){location.replace("/");return}
      if(mode==="reset"){history.replaceState(null,"","/login.html");setMode("login");setErr("msg.pwUpdated")}
      else setErr(mode==="register"?"msg.verifySent":"msg.mailIfEligible");
    }catch{setErr("err.fallback")}finally{$("#go").disabled=false}
  };
  if (typeof window !== "undefined") window.ritualLoginI18n = { t, getLang: () => curLang, setLang, resolveLang, detectBrowserLang, mapAuthError, I18N };
})();
</script>
</body>
</html>
