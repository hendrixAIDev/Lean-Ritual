[hidden]{display:none!important}
/* 布局：手机优先的单栏训练本，底部五个标签；数字用窄体，像杠铃片上的刻字 */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#15201C; --muted:#55635E; --line:#D3DBD7;
  --accent:#0C7560; --accent-soft:#D5EBE4; --on-accent:#FFFFFF;
  --good:#2C7A4B; --warn:#8C5107; --bad:#A83A3A; --warn-soft:#F6E7CF; --bad-soft:#F4DADA;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",var(--f-body);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --sunk:#1D2724; --ink:#E3EAE7; --muted:#8FA09A; --line:#2A3632;
  --accent:#3FBF9E; --accent-soft:#17362E; --on-accent:#05211A;
  --good:#5BC285; --warn:#E3A24A; --bad:#E77B7B; --warn-soft:#3A2C16; --bad-soft:#3B1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --sunk:#1D2724; --ink:#E3EAE7; --muted:#8FA09A; --line:#2A3632;
  --accent:#3FBF9E; --accent-soft:#17362E; --on-accent:#05211A;
  --good:#5BC285; --warn:#E3A24A; --bad:#E77B7B; --warn-soft:#3A2C16; --bad-soft:#3B1E1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:4px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.datebar{display:flex;align-items:center;gap:4px}
.datebar .d{font-family:var(--f-num);font-size:22px;font-weight:600;min-width:7.5em;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:44px;height:44px;border-radius:8px;font-size:18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px;min-width:44px;padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{display:flex;width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--bad)}
.btn.small{padding:8px 12px;font-size:13px}
.link{background:none;border:none;color:var(--accent);padding:0;font-weight:500}
button.link,a.link{min-height:44px;min-width:44px;display:inline-flex;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:13px;color:var(--ink);border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.muted{color:var(--muted)}
button.chip,a.chip,label.chip{min-height:44px;min-width:44px;padding:8px 12px;justify-content:center;cursor:pointer;text-decoration:none}
.tip .chip:not(.on){background:var(--surface);border-color:var(--line)}
label,.lbl{font-size:13px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;min-width:0}
.checkline{flex-direction:row;align-items:center;gap:10px;min-height:44px;color:var(--ink);cursor:pointer}
.checkline.top-align{align-items:flex-start}
.checkline.top-align input{margin-top:2px}
.checkline a{color:var(--accent);text-decoration:underline}
.checkline input{width:24px;height:24px;margin:0;flex:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select{min-height:44px}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks input{position:absolute;opacity:0;width:1px;height:1px}
.checks label{flex-direction:row}
.checks span{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}
.checks input:checked+span{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.checks input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
fieldset.ufb-group{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
fieldset.ufb-group legend{font-size:13px;color:var(--muted);padding:0}
.ufb-shot{display:flex;flex-direction:column;gap:8px}
.sec-n{font-family:var(--f-num);font-size:26px;color:var(--accent);font-weight:700;line-height:1}
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.ex:first-of-type{border-top:none;padding-top:0}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex-h b{font-size:15px}
.presc{font-family:var(--f-num);font-size:18px;font-weight:600;white-space:nowrap}
.sets{display:grid;grid-template-columns:2.2em 1fr 1fr;gap:6px;align-items:center}
.sets .n{font-family:var(--f-num);color:var(--muted);font-size:15px}
.sets input{padding:6px 8px;font-family:var(--f-num);font-size:17px}
.tip{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink)}
.tip.warn{background:var(--warn-soft)}
.tip.bad{background:var(--bad-soft)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--warn)}
.macro-bars{display:grid;grid-template-columns:auto minmax(40px,1fr) auto;gap:8px 10px;align-items:center;font-size:13px}
.macro{display:contents}
.macro-lbl{white-space:nowrap}
.macro-val{white-space:nowrap;text-align:right}
.macro-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.macro-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.macro-field .mf-lbl{font-size:12px;line-height:1.25;color:var(--muted);font-weight:500;white-space:nowrap}
.mf-box{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:44px;min-width:0}
.mf-box:focus-within{border-color:var(--accent)}
.mf-box:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.mf-box input{border:0;background:transparent;padding:8px 0;flex:1 1 0;width:0;min-width:0;font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.mf-box input:focus-visible{outline:none}
.mf-box input::-webkit-inner-spin-button,.mf-box input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.mf-unit{font-size:12px;color:var(--muted);flex:none;white-space:nowrap;user-select:none}
.big{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1}
.kpi .k{font-size:12px;color:var(--muted)}
.meal{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px;min-width:0}
.meal:first-child{border-top:none;padding-top:0}
.meal-head{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.meal-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.meal-type{width:auto;min-width:0;max-width:100%;flex:0 1 auto;padding:4px 8px;font-weight:600}
.meal-time{flex:none;white-space:nowrap}
.meal .ph{width:72px;height:72px;border-radius:8px;background:var(--sunk);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.meal div.ph{text-align:center;padding:4px;line-height:1.25}
.meal .more{display:flex;flex-wrap:wrap;gap:8px}
.meal .more figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.meal .more img,.meal .more .ph2{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--sunk)}
.previews{display:flex;gap:6px;overflow-x:auto}.previews .preview{width:auto;max-width:48%;flex:1 1 0}
label.chip{position:relative}
label.chip input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
label.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.preview{max-height:180px;border-radius:8px;object-fit:cover;width:100%}
.ins{display:grid;grid-template-columns:6px 1fr;gap:10px}
.ins .s{border-radius:3px;background:var(--muted)}
.ins.good .s{background:var(--good)} .ins.warn .s{background:var(--warn)} .ins.bad .s{background:var(--bad)} .ins.info .s{background:var(--accent)}
.ins.declined{color:var(--muted)} .ins.declined .s{background:var(--line)}
.ins .b{display:flex;flex-direction:column;gap:4px;min-width:0}
.ins .chip{white-space:normal;text-align:left;justify-content:flex-start}
.chooser{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.chooser .prev{font-size:14px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tabs button{background:none;border:none;color:var(--muted);min-height:44px;min-width:44px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--accent);font-weight:700}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}
.day,.wk-row{display:flex;justify-content:space-between;gap:8px;min-height:44px;padding-block:10px;border:0;border-top:1px solid var(--line);align-items:center;width:100%;background:none;color:inherit;text-align:left}
.day .chip{white-space:normal}
.day:first-child,.wk-row:first-child{border-top:none}
.chart{width:100%;height:auto;display:block}
.ai-out{white-space:pre-wrap;font-size:14px}
ul.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
details>summary{cursor:pointer;min-height:44px;padding-block:11px}
details.how{background:var(--sunk);border-radius:8px;padding:0 10px}
details.how summary{font-size:13px;color:var(--accent);font-weight:500;padding-block:12px}
details.how[open]{padding-bottom:10px}
details.how[open] > *:not(summary){margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20;pointer-events:none}
.hero{padding-block:8px 4px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:40px;color:var(--accent)}
@media (max-width:380px){.kpis{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:360px){.datebar .d{font-size:19px;min-width:6em}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

const rawLsSet = (k, v) => { try { if (typeof localStorage !== "undefined") localStorage.setItem(k, v); } catch {} };

const PENDING_LANG_TTL_MS = 24 * 60 * 60 * 1000;
function markExplicitLang(l){
  rawLsSet("bj-lang", l);
  rawLsSet("bj-lang-set-at", String(Date.now()));
  rawLsSet("bj-lang-pending", l);
}
function clearPendingLang(){
  rawLsDel("bj-lang-pending");
}
function readPendingLang(){
  const p = validLang(rawLsGet("bj-lang-pending"));
  if (!p) return null;
  const ts = Number(rawLsGet("bj-lang-set-at"));
  if (!Number.isFinite(ts) || ts <= 0 || Date.now() - ts > PENDING_LANG_TTL_MS) {
    clearPendingLang();
    return null;
  }
  return p;
}
function detectBrowserLang(nav){
  const list = Array.isArray(nav?.languages) && nav.languages.length ? nav.languages : (typeof nav?.language === "string" && nav.language.trim() ? [nav.language] : []);
  if (!list.length) return "zh";

}
function queryLang(search){
  const s = String(search || "").replace(/^\?/, "");
  if (!s) return null;
  for (const part of s.split("&")) {
    const eq = part.indexOf("=");
    const k = eq < 0 ? part : part.slice(0, eq);
    if (k === "lang") {
      try { return validLang(decodeURIComponent(eq < 0 ? "" : part.slice(eq + 1))); } catch { return null; }
    }
  }
  return null;
}
function resolveLang({ search = "", explicit = null, profileLang = null, nav = null, preferProfile = false } = {}){
  const q = queryLang(search);
  if (q) return q;
  if (preferProfile) return validLang(profileLang) || validLang(explicit) || detectBrowserLang(nav);
  return validLang(explicit) || validLang(profileLang) || detectBrowserLang(nav);
}

function profileDiff(a, b){

  return Object.keys(lbl).filter(k => JSON.stringify(a[k] ?? null) !== JSON.stringify(b[k] ?? null)).map(k => `${lbl[k]}：${fmt(k, a[k])} → ${fmt(k, b[k])}`);
}
async function submitSetup(form){

  const bad = Object.entries({age:t("setup.reqAge"),height:t("setup.reqHeight"),weight:t("setup.reqWeight")}).filter(([k]) => !(+req[k] > 0)).map(([,l])=>l);

  if (bad.length || !days.length) { err.hidden = false; err.textContent = bad.length ? t("setup.errMissing", {fields: joinList(bad)}) : t("setup.errNoDays"); return; }
  const prev = clone(S.profile || {});
  const fields = {sex:g("sex")||"m", age:+g("age"), height:+g("height"), weight:+g("weight"), bf: g("bf") === "" ? null : +g("bf"),
    steps:+g("steps"), exp:g("exp")||"new", stage:g("stage")||"auto", trainDays:days, slot:g("slot")||"eve", equipment:g("equipment")||"gym",
    injuries:all("injuries"), injNote:g("injNote")||"", supps:all("supps"),

  const today = todayStr();

  const apply = p => { Object.assign(p, fields); if (chosenLang) p.lang = chosenLang; p.startDate = p.startDate || today; p.kcalAdjust = p.kcalAdjust || 0; p.deloadEvery = p.deloadEvery || 9; p.schema = SCHEMA_VERSION; };
  S.busy.setup = true; if (btn) btn.disabled = true;
  try {
    let h = null;
    if (prev.startDate) {
      const after = clone(prev); apply(after);
      h = {id:uid(), savedAt:new Date().toISOString(), before:prev, changes:profileDiff(prev, after)};
      await write("profileHistory/" + h.id, h);
    }
    await updateProfile(apply);

    if (h) S.profileHistory = [h, ...(S.profileHistory||[])];

    toast(prev.startDate ? t("toast.setupSavedKeep") : t("toast.saved"));
  } catch {}
  finally { S.busy.setup = false; if (btn) btn.disabled = false; }
}

const draftKey = (date, key) => date + "|" + key;
function getDraft(date, plan){
  const saved = S.days[date]?.workout, k = draftKey(date, plan.key);
  let d = S.drafts[k];
  if (!d && S.drafts[date]?.key === plan.key) { d = S.drafts[date]; S.drafts[k] = d; delete S.drafts[date]; persistDrafts(); }
  if (!d) {
    const srv = S.days[date]?.workoutDraft;
    d = saved && saved.key === plan.key ? clone(saved) : srv && srv.key === plan.key ? clone(srv) : {key:plan.key, exercises:plan.ex.map(e => ({name:e.name, sets:Array.from({length:e.sets}, () => ({w:"", r:""}))})), feel:"", pain:"none", painArea:"", note:""};
    S.drafts[k] = d;
  }
  // 训练动作变化时补齐；已经填过数的保留
  const hasData = x => x?.sets?.some(s => s.w !== "" || s.r !== "");
  plan.ex.forEach((e,i) => { const old = d.exercises[i]; if (!old || old.name !== e.name) d.exercises[i] = {name:e.name, sets: hasData(old) ? old.sets : Array.from({length:e.sets}, () => ({w:"", r:""}))}; });
  plan.ex.forEach((e,i) => { const ss = d.exercises[i].sets; while (ss.length < e.sets) ss.push({w:"", r:""}); if (ss.length > e.sets && ss.slice(e.sets).every(x => x.w === "" && x.r === "")) ss.length = e.sets; });
  d.exercises.length = plan.ex.length;
  return d;
}

function labelCalc(L){
  const e = numOr(L.e), amt = numOr(L.amt);

  const k = L.base === "100" ? amt/100 : amt;

  const r1 = v => Math.round((numOr(v,0))*k*10)/10;

}
function sampleErr(e, task = "estimate"){
  const c = e?.code;
  if (HOSTED && (c === "not_granted" || c === "sampling_disabled")) return t("err.aiNotConfiguredHosted");
  if (HOSTED && c === "session_expired") return t("err.sessionExpired");
  if (c === "not_granted" || c === "sampling_disabled" || c === "ai_failed") return t("err.aiUnavailable");
  if (c === "rate_limited") return t("err.rateLimited");
  if (c === "image_rejected") return t("err.imageRejected");
  if (c === "truncated") return t("err.truncated");
  if (c === "invalid_json") return t("err.invalidJson");
  if (c === "cancelled") return t("err.cancelled");
  if (c === "session_expired") return t("err.sessionExpired");
  if (c === "or_key") return t("err.or_key");
  if (c === "or_credit") return t("err.or_credit");
  if (c === "network") return t("err.aiNetwork");
  if (c && getLang() === "en" && hasOwn(API_ERR_EN, c)) return API_ERR_EN[c];
  if (c && getLang() !== "en" && hasOwn(API_ERR_ZH, c)) return API_ERR_ZH[c];

function isLongConflict(p, e){
  if (!p || !e?.after) return true;
  if (e.kind === "kcal") return (num(p.kcalAdjust) || 0) !== e.after.kcalAdjust;
  if (e.kind === "deload") return (p.deloadFrom ?? null) !== e.after.deloadFrom;
  if (e.kind === "swap" || e.kind === "edit") {
    const curSwap = Object.prototype.hasOwnProperty.call(p.swaps || {}, e.from) ? p.swaps[e.from] : null;
    const curEdit = (p.exEdits || {})[e.from] ?? null;
    return curSwap !== (e.after.swap ?? null) || !sameVal(curEdit, e.after.exEdit ?? null);
  }
  return true;
}
function restoreLongPrev(p, e){

  else if (e.kind === "deload") p.deloadFrom = e.prev.deloadFrom ?? null;
  else if (e.kind === "swap" || e.kind === "edit") {
    p.swaps = {...(p.swaps || {})};
    if (e.prev.swap == null) delete p.swaps[e.from]; else p.swaps[e.from] = e.prev.swap;
    p.exEdits = {...(p.exEdits || {})};
    if (e.prev.exEdit == null) delete p.exEdits[e.from]; else p.exEdits[e.from] = clone(e.prev.exEdit);
  }
}
function isTodayConflict(day, e){

}
function restoreTodayPrev(day, e){

}
async function undoAdjust(entryId){

  if (!entry || !entry.prev || !entry.after) return;
  const dayDate = entry.scope === "today" ? (entry.dayDate || entry.date) : null;
  try {
    const result = await mutateAdjustment(dayDate, entry.feedbackId, entry.idx, (p, day, feedback) => {
      const current = p.adjustLog?.find(x => x?.id === entryId);
      if (!current || current.reverted) return {already:true};
      if (day ? isTodayConflict(day, current) : isLongConflict(p, current)) return {conflict:true};
      let savedW;
      if (day) savedW = restoreTodayPrev(day, current);
      else restoreLongPrev(p, current);
      current.reverted = true;
      if (feedback) changeFeedback(feedback, current.idx, false);
      return {written:true, savedW};
    });
    if (result.already) {
      render();

    }

      const msg = dayDate ? t("fb.conflictToday") : t("fb.conflictDefault");
      S.undoConflict = {id:entryId, kind:entry.kind, scope:entry.scope, from:entry.from || null, dayConflict:!!dayDate, msg};
      render();
      return toast(msg, 4000);
    }

      if (result.savedW) backupWorkout(dayDate, result.savedW);
      Object.keys(S.drafts).filter(k => k.startsWith(dayDate + "|")).forEach(k => {
        if (result.savedW || !hasDraftData(S.drafts[k])) delete S.drafts[k];
      });
      persistDrafts();
    }
    S.undoConflict = null;
    render();
    toast(t("toast.undone"));
  } catch (e) { saveErr(e); }
}

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || "");
      const idx = s.indexOf(",");
      resolve(idx >= 0 ? s.slice(idx + 1) : s);
    };
    r.onerror = () => reject(r.error || new Error("read_failed"));
    r.readAsDataURL(blob);
  });
}
async function prepareFeedbackScreenshot(file){
  const maxBytes = 15 * 1024 * 1024;
  const r = await compress2(file);
  if (r.ok && r.blob) {
    if (r.blob.size > maxBytes) throw {code:"too_large"};
    return {dataBase64: await blobToBase64(r.blob), contentType: r.blob.type || "image/jpeg"};
  }
  if (/^image\/(jpeg|png|webp|gif)$/i.test(file.type || "")) {
    if (file.size > maxBytes) throw {code:"too_large"};
    return {dataBase64: await blobToBase64(file), contentType: file.type};
  }
  throw {code:"bad_type"};
}

document.addEventListener("error", ev => {

  delete img.dataset.photoFallback;
  if (img.dataset.fb) img.src = img.dataset.fb;

}, true);

function focusAdoptTrigger(k){
  const list = typeof document !== "undefined" && typeof document.querySelectorAll === "function" ? document.querySelectorAll('[data-act="adopt-open"]') : [];
  for (const el of list) if (el.dataset?.key === k) { focusEl(el); return; }
}
document.addEventListener("keydown", ev => {

});

      try { S.library = await mutate("app/library", cur => { const l = cur || {links:{}}; l.links = {...(l.links||{})}; if (url) l.links[v] = url; else delete l.links[v]; return l; }); render(); toast(url ? t("toast.favSaved") : t("toast.favRemoved")); } catch (e) { saveErr(e); }
      break;
    }
    case "label-open": { const m = (S.days[S.date]?.meals||[]).find(x => x.id === v); S.label = {id:v, base:"100", u:"kJ", e:"", p:"", f:"", c:"", amt:guessAmount(m?.text)}; render(); focusEl($("#lb-e")); break; }
    case "label-close": S.label = null; render(); break;
    case "label-base": S.label.base = v; render(); break;
    case "label-save": {
      const res = labelCalc(S.label); if (!res) { toast(t("toast.labelNeedInput")); return; }
      const L = S.label, per = L.base === "100" ? "每100g" : "每份";
      const patch = {kcal:res.kcal, protein:res.protein, fat:res.fat, carbs:res.carbs, by:"label", label:true, confidence:"高", tip:"",
        calc:`${per} ${L.e}${L.u}${L.u==="kJ"?`（${Math.round(res.kcal100)} kcal）`:""}、蛋白 ${L.p||0}g、脂肪 ${L.f||0}g、碳水 ${L.c||0}g，× ${Math.round(res.k*100)/100}`, at:new Date().toISOString()};
      S.label = null;
      try { await updateDay(S.date, d => { const m = d.meals.find(x => x.id === v); if (m) { m.est = {...(m.est||{}), ...patch}; delete m.est.photoUsed; } }); toast(t("toast.labelUpdated")); } catch {}
      break;
    }
    case "ed-open": openEditor(+v); render(); focusEl($("#ed-name")); break;
    case "ed-cancel": { const i = S.ed?.i; S.ed = null; render(); if (i != null) focusEl($(`[data-act="ed-open"][data-v="${i}"]`)); break; }
    case "ed-pick": { const m = exMeta(v); Object.assign(S.ed, {name:exName(v)}, m ? {lo:m.lo, hi:m.hi} : {}); render(); break; }
    case "ed-ai": aiSuggest(); break;
    case "ed-ai-pick": { const a = S.ed.ai[+v]; Object.assign(S.ed, {name:exName(a.name), sets:a.sets, lo:a.lo, hi:a.hi}); render(); break; }
    case "ed-scope": S.ed.scope = v; render(); break;
    case "ed-save": await saveEdit(false); break;
    case "ed-reset": await saveEdit(true); break;
    case "del-exedit": await revertSingleExEdit(v); break;
    case "del-swap": await revertSingleSwap(v); break;
    case "clear-exedits": { S.undoConflict = null; const td = todayStr(); updateProfile(p => { (p.adjustLog = p.adjustLog||[]).push({date:td, text:"课表长期调整全部恢复默认"}); p.exEdits = {}; }).catch(()=>{}); break; }
    case "clear-swaps": S.undoConflict = null; updateProfile(p => { p.swaps = {}; }).catch(()=>{}); break;
  }
});
function persistDrafts(){ lsSet("bj-drafts", S.drafts); }
let logoutSyncMs = 5000;
function clearUserLocal(id = S.uid || storageUser){
  if (!id) return;
  try {
    const prefix = `bj-user:${id}:`, keys = new Set(Object.keys(localStorage).filter(k => k.startsWith(prefix)));
    if (typeof localStorage.length === "number" && typeof localStorage.key === "function") {
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix)) keys.add(k); }
    }
    keys.forEach(k => localStorage.removeItem(k));
  } catch {}
}
function draftPayload(d, key = d?.key || ""){
  return {
    key: String(key || ""),
    exercises: (d?.exercises || []).map(e => ({
      name: String(e?.name || ""),
      sets: (e?.sets || []).map(s => ({w: String(s?.w ?? ""), r: String(s?.r ?? "")}))
    })),
    feel: d?.feel === "" || d?.feel == null ? "" : String(d.feel),
    pain: d?.pain || "none",
    painArea: String(d?.painArea || ""),
    note: String(d?.note || "")
  };
}
function hasDraftData(d){
  if (!d || typeof d !== "object") return false;
  if (d.exercises?.some(e => e?.sets?.some(s => String(s?.r ?? "") !== "" || String(s?.w ?? "") !== ""))) return true;
  if (d.feel !== "" && d.feel != null) return true;
  if (d.pain && d.pain !== "none") return true;
  return String(d.painArea || "").trim() !== "" || String(d.note || "").trim() !== "";
}
function sameDraft(a, aKey, b, bKey){
  return !!aKey && aKey === bKey && JSON.stringify(draftPayload(a, aKey)) === JSON.stringify(draftPayload(b, bKey));
}
function isVerifiedInDay(entry, doc){
  if (!doc || !entry.key) return false;
  if (doc.workout?.done && sameDraft(entry.draft, entry.key, doc.workout, String(doc.workout.key || ""))) return true;
  if (!doc.workout?.done && doc.workoutDraft && sameDraft(entry.draft, entry.key, doc.workoutDraft, String(doc.workoutDraft.key || ""))) return true;
  return false;
}
function localDraftEntries(id = S.uid || storageUser){
  let stored = {};
  if (id) {
    try {
      const parsed = JSON.parse(localStorage.getItem(`bj-user:${id}:bj-drafts`) || "{}");
      if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) stored = parsed;
    } catch { return [{invalid: true, sig: "invalid"}]; }
  }
  const seen = new Set(), out = [];
  const add = (rawKey, d) => {
    if (!hasDraftData(d)) return;
    const [date, kKey] = rawKey.split("|"), key = String(d.key || kKey || "");
    const sig = `${date}|${key}|${JSON.stringify(draftPayload(d, key))}`;
    if (seen.has(sig)) return;
    seen.add(sig);
    out.push({date, key, draft: clone(d), sig});
  };
  for (const [k, d] of Object.entries(S.drafts || {})) add(k, d);
  for (const [k, d] of Object.entries(stored)) add(k, d);
  return out;
}
function snapshotSig(entries){
  return entries.map(e => e.sig).sort().join("\n");
}
async function verifyAndSyncDrafts(entries){
  if (!S.store) return false;
  let allOk = true;
  const byDate = new Map();
  for (const e of entries) {
    if (e.invalid || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !e.key) { allOk = false; continue; }
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }
  await Promise.all([...byDate.entries()].map(async ([date, list]) => {
    await (locks["days/" + date] || Promise.resolve()).catch(() => {});
    let doc = await S.store.get("days/" + date);
    const pending = list.filter(e => !isVerifiedInDay(e, doc));
    if (!pending.length) return;
    if (pending.length === 1 && !doc?.workout?.done) {
      const p = pending[0], srv = doc?.workoutDraft;
      const srvHasOther = srv && hasDraftData(srv) && String(srv.key || "") !== p.key;
      if (!srvHasOther && list.length === 1) {
        doc = await mutate("days/" + date, cur => {
          if (cur?.workout?.done) return null;
          if (cur?.workoutDraft && hasDraftData(cur.workoutDraft) && String(cur.workoutDraft.key || "") !== p.key) return null;
          const x = migrateDay(cur || {date, meals:[]});
          x.workoutDraft = {...clone(p.draft), key:p.key, updatedAt:new Date().toISOString()};
          stampTargets(x);
          return x;
        });
        if (doc) S.days[date] = migrateDay(doc);
      }
    }
    if (!list.every(e => isVerifiedInDay(e, doc))) allOk = false;
  }));
  return allOk;
}
async function runBoundedVerify(entries){
  let timer;
  try {
    return await Promise.race([
      verifyAndSyncDrafts(entries),
      new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("sync_timeout")), logoutSyncMs); })
    ]);
  } catch {
    return false;
  } finally {
    clearTimeout(timer);
  }
}
async function logout(btn){
  if (S.busy.logout) return;
  S.busy.logout = true;
  if (btn) btn.disabled = true;
  try {
    clearTimeout(syncDraft.t);
    const id = S.uid || storageUser;
    let entries = localDraftEntries(id);
    if (entries.length) {
      if (S.consentRequired) {
        const ask = typeof confirm === "function" ? confirm : window?.confirm;
        if (!(typeof ask === "function" && ask(t("account.unsyncedLogoutGatedConfirm")))) return;
      } else {
        let verified = await runBoundedVerify(entries);
        if (verified) {
          clearTimeout(syncDraft.t);
          const afterFirst = localDraftEntries(id);
          if (snapshotSig(afterFirst) !== snapshotSig(entries)) {
            entries = afterFirst;
            verified = entries.length ? await runBoundedVerify(entries) : true;
            if (verified) {
              clearTimeout(syncDraft.t);
              if (snapshotSig(localDraftEntries(id)) !== snapshotSig(entries)) verified = false;
            }
          }
        }
        if (!verified) {
          const ask = typeof confirm === "function" ? confirm : window?.confirm;
          if (!(typeof ask === "function" && ask(t("account.unsyncedLogoutConfirm")))) return;
        }
      }
    }
    clearTimeout(syncDraft.t);
    storageUser = null;
    S.drafts = {};
    S.cfill = {};
    clearUserLocal(id);
    try { await window.ritual?.logout?.(); } catch {}
    const loc = typeof location !== "undefined" ? location : window?.location;
    if (loc) loc.href = "/login.html";
  } finally {
    S.busy.logout = false;
    if (btn) btn.disabled = false;
  }
}
// 边填边存：停手 2 秒后把草稿存到服务器，换设备或页面被关掉也不会丢
function syncDraft(date, key){
  clearTimeout(syncDraft.t);
  syncDraft.t = setTimeout(() => {
    const d = S.drafts[draftKey(date, key)]; if (!d) return;
    if (S.days[date]?.workout?.done && S.days[date].workout.key === key) return;
    updateDay(date, x => { x.workoutDraft = {...clone(d), key, updatedAt:new Date().toISOString()}; }, {quiet:true, silent:true}).catch(() => {});
  }, 2000);
}
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.ed && S.ed) { S.ed[el.dataset.ed] = el.value; return; }
  if (el.dataset.lb && S.label) { S.label[el.dataset.lb] = el.value; const r = labelCalc(S.label), o = $("#lb-res"); if (o) o.textContent = r ? t("label.res", r) : t("label.resEmpty"); return; }
  if (el.dataset.set) {
    const [i,j,k] = el.dataset.set.split(".");
    const pl = planFor(S.date), d = getDraft(S.date, pl); d.exercises[+i].sets[+j][k] = el.value; persistDrafts(); syncDraft(S.date, pl.key);
  } else if (el.dataset.f) {
    const pl = planFor(S.date), d = getDraft(S.date, pl); d[el.dataset.f] = el.value; persistDrafts(); syncDraft(S.date, pl.key);
  } else if (el.id === "m-text") lsSet("bj-mtext", el.value);
  else if (el.id === "fb-text") lsSet("bj-fbtext", el.value);
  else if (el.id === "ufb-msg" && S.ufb) { S.ufb.message = el.value; const c = $("#ufb-count"); if (c) c.textContent = `${Array.from(el.value).length} / 2000`; }
  else if (el.dataset.mf) { S.mfill = {...(S.mfill || {}), [el.dataset.mf]: el.value}; }
  else if (/^c-(weight|steps|sleep|bf|waist)$/.test(el.id)) { const k = el.id.slice(2); S.cfill = {...(S.cfill || {}), [S.date]: {...(S.cfill?.[S.date] || {}), [k]: el.value}}; }
});
document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.id === "lift-sel") { S.liftSel = el.value; lsSet("bj-lift", el.value); render(); return; }
  if (el.id === "cg-terms" || el.id === "cg-sensitive") {
    S.consentDraft = { terms: !!$("#cg-terms")?.checked, sensitive: !!$("#cg-sensitive")?.checked };
    if (S.consentDraft.terms && S.consentDraft.sensitive && S.consentErr) { S.consentErr = null; render(); }
    return;
  }
  if (el.name === "ufb-type" && S.ufb) { S.ufb.type = el.value; return; }
  if (el.id === "ufb-device" && S.ufb) { S.ufb.includeDeviceInfo = !!el.checked; return; }
  if (el.id === "ufb-file" && S.ufb && el.files?.[0]) {
    if (S.ufb.previewUrl) { try { URL.revokeObjectURL(S.ufb.previewUrl); } catch {} }
    S.ufb.file = el.files[0];
    S.ufb.previewUrl = URL.createObjectURL(el.files[0]);
    S.ufb.errKey = null; S.ufb.errObj = null;
    render();
    return;
  }
  if (el.name === "mtype") { S.mtype = el.value; return; }
  if (el.dataset.mtypeOf) {
    const id = el.dataset.mtypeOf, v = el.value;
    updateDay(S.date, d => { const m = d.meals.find(x => x.id === id); if (m) m.type = v; }).then(() => toast(t("toast.mealTypeChanged", {type:mealTypeLabel(v)}))).catch(()=>{});
    return;
  }
  if (el.dataset.more && el.files?.[0]) { addMorePhoto(S.date, el.dataset.more, el.files[0], el.dataset.tag || "其他"); return; }
  if (el.id === "m-photo" && el.files?.[0]) {
    const have = S.pendingPhotos || [];
    S.pendingPhotos = [...have, ...[...el.files].slice(0, 4 - have.length).map(file => ({file, url:URL.createObjectURL(file)}))];
    if (have.length + el.files.length > 4) toast(t("toast.max4Photos"));
    const keep = $("#m-text")?.value; render(); if (keep != null && $("#m-text")) $("#m-text").value = keep;
  } else if (el.dataset.cu) {
    const [i, f] = el.dataset.cu.split("."), val = el.value;
    updateDay(S.date, d => { const e = d.custom?.ex?.[+i]; if (e) e[f] = f === "name" ? canonExName(val) : (val === "" ? "" : +val); }).catch(()=>{});
  } else if (el.dataset.meal) {
    const id = el.dataset.meal, k = el.dataset.k, val = roundMacro(k, el.value);
    el.value = val == null ? "" : String(val);
    updateDay(S.date, d => { const m = d.meals.find(x => x.id === id); if (m) m.est = {...(m.est||{}), [k]: val, ...(m.est?.by ? {} : {by:"manual"})}; }).catch(()=>{});
  }
});
document.addEventListener("toggle", ev => {
  const el = ev.target; if (!el.dataset?.cue) return;
  S.openCues = S.openCues || new Set();
  el.open ? S.openCues.add(el.dataset.cue) : S.openCues.delete(el.dataset.cue);
}, true);
document.addEventListener("submit", ev => { if (ev.target.id === "setup") { ev.preventDefault(); submitSetup(ev.target); } });
if (typeof window !== "undefined" && window.ritualErrorReporter) {
  window.ritualErrorReporter.configure({
    getPage: () => (!S.ready ? "boot" : S.consentRequired ? "consent" : !S.profile ? "setup" : (S.tab || "today")),
    getLang: () => getLang()
  });
}

/* ============ 启动 ============ */
async function finishBootAfterConsent(){
  let lim = null;
  if (S.serverSample) { lim = await S.serverSample.limits().catch(e => ({err:String(e?.code||e)})); S.imgOK = lim?.images ? true : (lim && !lim.err ? false : null); }
  S.serverImgOK = S.imgOK;
  applyAI();
  // 诊断：记下这次打开时平台给的能力，方便排查看图估算
  if (S.cloud) { try { S.store.set("meta/diag", {at:new Date().toISOString(), ua:navigator.userAgent.slice(0,200), sample:!!S.serverSample, ai:S.aiProv, limits:lim ? JSON.parse(JSON.stringify(lim)) : null, assets:!!S.assets, comments:!!S.comments, owner:S.owner}).catch(()=>{}); } catch {} }
  await loadAll();
  if (S.cloud) { try { S.account = await S.store.get("meta/account"); } catch {} }
  S.ready = true; render();
  rescueDrafts();
}
(async function boot(){
  const use = n => (window.ritual?.use ? window.ritual.use(n).catch(() => null) : Promise.resolve(null));
  const [db, assets, sample, comments, user] = await Promise.all([use("db"), use("assets"), use("sample"), use("comments"), use("user")]);
  S.comments = comments;
  const me = user ? await user.me().catch(() => null) : null;
  if (!db || !me?.id) {
    $("#app").innerHTML = t("boot.authUnavailable");
    return;
  }
  storageUser = me.id;
  S.tab = lsGet("bj-tab", "today");
  S.drafts = lsGet("bj-drafts", {});
  S.hostUser = me;
  S.uid = me?.id || null; S.owner = !!(me?.isOwner || me?.canEdit); // 主人或编辑者（admin）才能读旧的共享根路径
  S.cloud = !!(db && S.uid); S.raw = S.cloud ? db : null; S.assets = assets; S.sample = sample;
  S.noId = !!db && !S.uid;
  S.store = mkCloud(db, `data/users/${S.uid}/app`);
  S.serverSample = sample;
  S.consentRequired = !!me.consentRequired;
  if (S.consentRequired) {
    S.consentDraft = {terms: false, sensitive: false};

    return;
  }
  await finishBootAfterConsent();
})();
// 找回这台设备上填了但没点保存的训练
function rescueDrafts(){
  if (!S.profile) return;
  const found = [];
  for (const [k, d] of Object.entries(S.drafts || {})) {
    if (!d?.exercises?.some(e => e.sets?.some(s => s.r !== "" || s.w !== ""))) continue;
    const date = k.split("|")[0];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || S.days[date]?.workout?.done) continue;
    found.push(date);
    updateDay(date, x => { if (!x.workout?.done && !x.workoutDraft) x.workoutDraft = {...clone(d), key:d.key, updatedAt:new Date().toISOString()}; }, {quiet:true, silent:true}).catch(() => {});
  }
  if (found.length) toast(t("toast.rescueDrafts", {dates: joinList([...new Set(found)].map(fmtShortDate))}), 8000);
}
