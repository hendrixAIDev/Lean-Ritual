<title>薄肌日课</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：手机优先的单栏训练本，底部五个标签；数字用窄体，像杠铃片上的刻字 */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#15201C; --muted:#5B6964; --line:#D3DBD7;
  --accent:#0C7560; --accent-soft:#D5EBE4; --on-accent:#FFFFFF;
  --good:#2C7A4B; --warn:#A5610A; --bad:#A83A3A; --warn-soft:#F6E7CF; --bad-soft:#F4DADA;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",var(--f-body);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --sunk:#1D2724; --ink:#E3EAE7; --muted:#8FA09A; --line:#2A3632;
  --accent:#3FBF9E; --accent-soft:#17362E; --on-accent:#05211A;
  --good:#5BC285; --warn:#E3A24A; --bad:#E77B7B; --warn-soft:#3A2C16; --bad-soft:#3B1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --sunk:#1D2724; --ink:#E3EAE7; --muted:#8FA09A; --line:#2A3632;
  --accent:#3FBF9E; --accent-soft:#17362E; --on-accent:#05211A;
  --good:#5BC285; --warn:#E3A24A; --bad:#E77B7B; --warn-soft:#3A2C16; --bad-soft:#3B1E1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:4px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.datebar{display:flex;align-items:center;gap:4px}
.datebar .d{font-family:var(--f-num);font-size:22px;font-weight:600;min-width:7.5em;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--bad)}
.link{background:none;border:none;color:var(--accent);padding:0;font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:13px;color:var(--ink);border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.chip{cursor:pointer}
.tip .chip:not(.on){background:var(--surface);border-color:var(--line)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks input{position:absolute;opacity:0;width:1px;height:1px}
.checks label{flex-direction:row}
.checks span{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}
.checks input:checked+span{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.checks input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sec-n{font-family:var(--f-num);font-size:26px;color:var(--accent);font-weight:700;line-height:1}
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.ex:first-of-type{border-top:none;padding-top:0}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex-h b{font-size:15px}
.presc{font-family:var(--f-num);font-size:18px;font-weight:600;white-space:nowrap}
.sets{display:grid;grid-template-columns:2.2em 1fr 1fr;gap:6px;align-items:center}
.sets .n{font-family:var(--f-num);color:var(--muted);font-size:15px}
.sets input{padding:6px 8px;font-family:var(--f-num);font-size:17px}
.tip{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink)}
.tip.warn{background:var(--warn-soft)}
.tip.bad{background:var(--bad-soft)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--warn)}
.macro{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;align-items:center;font-size:13px}
.big{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1}
.kpi .k{font-size:12px;color:var(--muted)}
.meal{display:grid;grid-template-columns:84px 1fr;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.meal:first-child{border-top:none;padding-top:0}
.meal .ph{width:84px;height:84px;border-radius:8px;background:var(--sunk);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.meal .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal .more{display:flex;flex-wrap:wrap;gap:8px}
.meal .more figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.meal .more img,.meal .more .ph2{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--sunk)}
.previews{display:flex;gap:6px;overflow-x:auto}.previews .preview{width:auto;max-width:48%;flex:1 1 0}
label.chip input[type=file]{display:none}
.preview{max-height:180px;border-radius:8px;object-fit:cover;width:100%}
.ins{display:grid;grid-template-columns:6px 1fr;gap:10px}
.ins .s{border-radius:3px;background:var(--muted)}
.ins.good .s{background:var(--good)} .ins.warn .s{background:var(--warn)} .ins.bad .s{background:var(--bad)} .ins.info .s{background:var(--accent)}
.ins .b{display:flex;flex-direction:column;gap:4px;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tabs button{background:none;border:none;color:var(--muted);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button.on{color:var(--accent);font-weight:700}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}
.day{display:flex;justify-content:space-between;gap:8px;padding-block:10px;border-top:1px solid var(--line);align-items:center}
.day:first-child{border-top:none}
.chart{width:100%;height:auto;display:block}
.ai-out{white-space:pre-wrap;font-size:14px}
ul.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
details.how{background:var(--sunk);border-radius:8px;padding:6px 10px}
details.how summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
details.how[open]{padding-bottom:10px}
details.how[open] > *:not(summary){margin-top:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20;pointer-events:none}
.hero{padding-block:8px 4px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:40px;color:var(--accent)}
@media (max-width:380px){.kpis{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function mkCloud(db, prefix){
  const P = x => prefix ? prefix + "/" + x : x;
  return {
    async get(p){ const s = await db.doc(P(p)).get(); return s.exists ? clone(s.data()) : null; },
    async set(p, d){ await db.doc(P(p)).set(d); },
    async del(p){ await db.doc(P(p)).delete(); },
    async list(col, opt={}){ let q = db.collection(P(col)); if (opt.order) q = q.orderBy(opt.order, "desc"); if (opt.limit) q = q.limit(opt.limit); const s = await q.get(); return s.docs.map(d => ({id:d.id, data:clone(d.data())})); }
  };
}

const locks = {};
function mutate(path, fn){
  const p = (locks[path] || Promise.resolve()).catch(() => {}).then(async () => {
    const cur = await S.store.get(path);
    const next = fn(cur ? clone(cur) : null);
    if (next == null) return cur;
    await S.store.set(path, next);
    return next;
  });
  locks[path] = p;
  return p;
}
const saveErr = e => toast("保存失败（" + (e?.code || e?.message || "网络问题") + "），请刷新页面后再试");
async function updateDay(date, fn, opt = {}){
  const local = migrateDay(S.days[date] || {date, meals:[]}); fn(local); stampTargets(local); S.days[date] = local;
  if (!opt.quiet) render();
  try {
    const next = await mutate("days/" + date, cur => { const d = migrateDay(cur || {date, meals:[]}); fn(d); stampTargets(d); return d; });
    S.days[date] = migrateDay(next);
    if (!opt.quiet) render();
    return next;
  } catch (e) { console.warn("day write failed", e); if (!opt.silent) saveErr(e); throw e; }
}

async function restoreWorkouts(){
  let logs = [];
  try { logs = (await S.store.list("workoutLog", {order:"savedAt", limit:1000})).map(d => d.data); } catch {}
  const latest = {};
  logs.forEach(l => { if (l?.date && l.workout && (!latest[l.date] || l.savedAt > latest[l.date].savedAt)) latest[l.date] = l; });
  const local = lsGet("bj-wbackup", {});
  Object.entries(local).forEach(([date, w]) => { if (!latest[date] && w?.done) latest[date] = {date, workout:w, savedAt:w.savedAt || ""}; });
  const restored = [];
  for (const [date, l] of Object.entries(latest)) {
    if (S.days[date]?.workout?.done) continue;
    try { await updateDay(date, d => { if (!d.workout?.done) d.workout = clone(l.workout); }, {quiet:true, silent:true}); restored.push(date); } catch {}
  }
  if (restored.length) toast(`已从备份恢复 ${restored.length} 天的训练记录`, 8000);
}

function checkins(){ return Object.values(S.days).filter(d => numOr(d.checkin?.weight) != null).sort((a,b)=>a.date.localeCompare(b.date)); }

function avgBf(endDate, span=14){
  const start = addDays(endDate, -(span-1));
  const v = Object.values(S.days).filter(d => d.date >= start && d.date <= endDate).map(d => numOr(d.checkin?.bf)).filter(x => x != null && x > 2 && x < 60);

  const t = todayStr();
  const done = Object.values(S.days).filter(d => d.workout?.done && ORDER.includes(d.workout.key));
  const before = dt => done.filter(d => d.date < dt).sort((a,b)=>b.date.localeCompare(a.date))[0]?.workout.key;
  let last = before(date > t ? t : date);
  const nx = () => last ? ORDER[(ORDER.indexOf(last)+1) % 3] : "push";

  for (let d = t; d < date; d = addDays(d, 1)) {
    const day = S.days[d] || {};

    if (day.workout?.done) k = day.workout.key;
    else if (day.override && day.override !== "rest") k = day.override;
    else if (day.override !== "rest" && (S.profile.trainDays || []).includes(parseD(d).getDay())) k = nx();

}
function resolveEx(ex){

  const home = p.equipment === "home" && ex.home;

const extraEx = day => (day.extra?.ex || []).map(e => ({name:e.name || "未命名动作", sets:+e.sets || 3, lo:e.lo === "" ? "" : (+e.lo || ""), hi:e.hi === "" ? "" : (+e.hi || ""), rest:"1–2 分钟", inc:0, orig:e.name || "未命名动作", why:"加练", extra:true}));

function shrink(img, max, q){
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const isHeic = f => /hei[cf]/i.test(f.type || "") || /\.hei[cf]$/i.test(f.name || "");
function loadHeic(){
  if (window.heic2any) return Promise.resolve(window.heic2any);
  return new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
    sc.onload = () => window.heic2any ? res(window.heic2any) : rej(new Error("no heic2any")); sc.onerror = () => rej(new Error("heic lib load failed"));
    document.head.appendChild(sc);
  });
}
async function compress2(file, tried){
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const big = shrink(img, 1600, 0.85);
    const blob = await new Promise(res => big.toBlob(b => res(b), "image/jpeg", 0.85));
    let thumb = null; try { thumb = shrink(img, 480, 0.6).toDataURL("image/jpeg", 0.6); } catch {}
    URL.revokeObjectURL(url);
    return blob ? {blob, thumb, ok:true} : {blob:file, thumb, ok:false};
  } catch {
    if (!tried && isHeic(file)) {
      try { toast("正在把 HEIC 照片转成 JPG…", 8000); const conv = await (await loadHeic())({blob:file, toType:"image/jpeg", quality:0.85}); const b = Array.isArray(conv) ? conv[0] : conv; return await compress2(b, true); } catch (e) { console.warn("heic convert failed", e); }
    }
    return {blob:file, thumb:null, ok:false};
  }
}
async function compress(file){
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
  } catch { return file; }
}

// 上传一张照片：返回 {id} 或 {thumb}（没有资产权限/上传失败时留小图）
async function uploadOne(file){
  const r = await compress2(file);
  if (S.assets && r.ok) {
    for (let k = 0; k < 2; k++) { try { return {id:(await S.assets.upload(r.blob, {type:"image/jpeg"})).id, blob:r.blob}; } catch (e) { if (k || !["store_unavailable","upstream_error","rate_limited"].includes(e?.code)) { console.warn("upload failed", e); break; } await new Promise(res => setTimeout(res, 1500)); } }
  }
  return r.thumb ? {thumb:r.thumb, blob:r.blob} : null;
}

async function loadPhoto(m){
  if (S.files[m.id]?.blob) return S.files[m.id].blob;
  if (!m.photo) { if (m.thumb) { try { return await (await fetch(m.thumb)).blob(); } catch {} } return null; }
  try { const r = await fetch("/_blob/" + m.photo); if (r.ok) { const b = await r.blob(); if (b.size && /^image\//.test(b.type)) return b; } } catch {}
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = "/_blob/" + m.photo; });
    const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0);
    return await new Promise(res => c.toBlob(b => res(b), "image/jpeg", 0.9));
  } catch { return null; }
}

        await updateDay(date, day => { day.workout = {...(day.workout || {}), ...clone(w)}; delete day.override; delete day.workoutDraft; delete day.extra; });
        backupWorkout(date, w);
        delete S.drafts[draftKey(date, plan.key)]; persistDrafts(); render();
        toast("训练已保存");
      } catch {}
      break;
    }
    case "save-checkin": {
      const g = id => { const x = $(id)?.value; return x === "" ? null : +x; };
      const c = {};
      [["weight","#c-weight"],["steps","#c-steps"],["sleep","#c-sleep"],["bf","#c-bf"],["waist","#c-waist"]].forEach(([k,id]) => { if ($(id)) c[k] = g(id); });
      if (Object.values(c).every(x => x == null)) { toast("先填一项再保存"); return; }
      try { await updateDay(S.date, day => { day.checkin = {...(day.checkin || {}), ...c}; }); toast("打卡已保存"); } catch {}
      break;
    }
    case "add-meal": addMeal(v === "manual" ? "manual" : "ai", b); break;
    case "mmode": S.mealMode = v; lsSet("bj-mmode", v); { const keep = $("#m-text")?.value; render(); if (keep != null && $("#m-text")) $("#m-text").value = keep; } break;
    case "ai-meal": {
      let anchor = null; if (S.comments) { try { anchor = await S.comments.anchorFor(b); } catch {} }
      aiEstimate(S.date, v, anchor); break;
    }
    case "est-meal": estimateMeal(S.date, v, true); break;
    case "unpick": { const f = (S.pendingPhotos || [])[+v]; if (f) { URL.revokeObjectURL(f.url); S.pendingPhotos.splice(+v, 1); } const keep = $("#m-text")?.value; render(); if (keep != null && $("#m-text")) $("#m-text").value = keep; break; }
    case "del-more": {
      if (S.confirmDel !== v) { S.confirmDel = v; render(); return; }
      S.confirmDel = null;
      const [mid, si] = v.split("|"), i = +si, p = S.days[S.date]?.meals?.find(x => x.id === mid)?.more?.[i];
      if (!p) break;
      try { await updateDay(S.date, d => { const x = d.meals.find(y => y.id === mid); const q = x?.more?.[i]; if (q && (q.id || null) === (p.id || null) && q.at === p.at) x.more.splice(i, 1); });
        if (p.id && S.assets) S.assets.delete(p.id).catch(()=>{}); toast("照片已删"); } catch {}
      break;
    }
    case "del-meal": {
      if (S.confirmDel !== v) { S.confirmDel = v; render(); return; }
      S.confirmDel = null;
      const m = (S.days[S.date]?.meals || []).find(x => x.id === v);
      try { await updateDay(S.date, day => { day.meals = day.meals.filter(x => x.id !== v); }); if (m?.photo && S.assets) S.assets.delete(m.photo).catch(()=>{}); if (S.assets) moreOf(m).forEach(p => p.id && S.assets.delete(p.id).catch(()=>{})); toast("已删除"); } catch {}
      break;
    }
    case "ai-run": runAI(); break;
    case "ai-stop": S.ai?.ctl?.abort(); break;
    case "apply": applyAction(JSON.parse(v)); break;
    case "start-deload": { const t = todayStr(); updateProfile(p => { p.deloadFrom = t; }).then(()=>toast("本周减载")).catch(()=>{}); break; }
    case "stop-deload": updateProfile(p => { p.deloadFrom = null; }).catch(()=>{}); break;
    case "reset-kcal": { const t = todayStr(); updateProfile(p => { p.kcalAdjust = 0; (p.adjustLog = p.adjustLog||[]).push({date:t, text:"热量调整归零"}); }).catch(()=>{}); break; }
    case "save-lib": {
      const inp = document.getElementById("lib-" + v); const url = (inp?.value || "").trim();
      if (url && !/^https:\/\/\S+$/.test(url)) { toast("请粘贴以 https:// 开头的链接"); return; }
      S.library = S.library || {links:{}}; S.library.links = {...(S.library.links||{})};
      if (url) S.library.links[v] = url; else delete S.library.links[v];
      render();
      try { S.library = await mutate("app/library", cur => { const l = cur || {links:{}}; l.links = {...(l.links||{})}; if (url) l.links[v] = url; else delete l.links[v]; return l; }); render(); toast(url ? "已收藏" : "已取消收藏"); } catch (e) { saveErr(e); }
      break;
    }
    case "label-open": { const m = (S.days[S.date]?.meals||[]).find(x => x.id === v); S.label = {id:v, base:"100", u:"kJ", e:"", p:"", f:"", c:"", amt:guessAmount(m?.text)}; render(); break; }
    case "label-close": S.label = null; render(); break;
    case "label-base": S.label.base = v; render(); break;
    case "label-save": {
      const res = labelCalc(S.label); if (!res) { toast("先填能量和吃了多少"); return; }
      const L = S.label, per = L.base === "100" ? "每100g" : "每份";
      const patch = {kcal:res.kcal, protein:res.protein, fat:res.fat, carbs:res.carbs, by:"label", label:true, confidence:"高", tip:"",
        calc:`${per} ${L.e}${L.u}${L.u==="kJ"?`（${Math.round(res.kcal100)} kcal）`:""}、蛋白 ${L.p||0}g、脂肪 ${L.f||0}g、碳水 ${L.c||0}g，× ${Math.round(res.k*100)/100}`, at:new Date().toISOString()};
      S.label = null;
      try { await updateDay(S.date, d => { const m = d.meals.find(x => x.id === v); if (m) { m.est = {...(m.est||{}), ...patch}; delete m.est.photoUsed; } }); toast("已按成分表更新"); } catch {}
      break;
    }
    case "ed-open": openEditor(+v); render(); break;
    case "ed-cancel": S.ed = null; render(); break;
    case "ed-pick": { const m = exMeta(v); Object.assign(S.ed, {name:v}, m ? {lo:m.lo, hi:m.hi} : {}); render(); break; }
    case "ed-ai": aiSuggest(); break;
    case "ed-ai-pick": { const a = S.ed.ai[+v]; Object.assign(S.ed, {name:a.name, sets:a.sets, lo:a.lo, hi:a.hi}); render(); break; }
    case "ed-scope": S.ed.scope = v; render(); break;
    case "ed-save": saveEdit(false); break;
    case "ed-reset": saveEdit(true); break;
    case "clear-exedits": { const t = todayStr(); updateProfile(p => { (p.adjustLog = p.adjustLog||[]).push({date:t, text:"课表长期调整全部恢复默认"}); p.exEdits = {}; }).catch(()=>{}); break; }
    case "clear-swaps": updateProfile(p => { p.swaps = {}; }).catch(()=>{}); break;
  }
});
function persistDrafts(){ lsSet("bj-drafts", S.drafts); }
// 边填边存：停手 2 秒后把草稿存到服务器，换设备或页面被关掉也不会丢
function syncDraft(date, key){
  clearTimeout(syncDraft.t);
  syncDraft.t = setTimeout(() => {
    const d = S.drafts[draftKey(date, key)]; if (!d) return;
    if (S.days[date]?.workout?.done && S.days[date].workout.key === key) return;
    updateDay(date, x => { x.workoutDraft = {...clone(d), key, updatedAt:new Date().toISOString()}; }, {quiet:true, silent:true}).catch(() => {});
  }, 2000);
}
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.ed && S.ed) { S.ed[el.dataset.ed] = el.value; return; }
  if (el.dataset.lb && S.label) { S.label[el.dataset.lb] = el.value; const r = labelCalc(S.label), o = $("#lb-res"); if (o) o.textContent = r ? `= ${r.kcal} kcal，蛋白 ${r.protein} g，脂肪 ${r.fat} g，碳水 ${r.carbs} g` : "填好能量和吃了多少就能算。"; return; }
  if (el.dataset.set) {
    const [i,j,k] = el.dataset.set.split(".");
    const pl = planFor(S.date), d = getDraft(S.date, pl); d.exercises[+i].sets[+j][k] = el.value; persistDrafts(); syncDraft(S.date, pl.key);
  } else if (el.dataset.f) {
    const pl = planFor(S.date), d = getDraft(S.date, pl); d[el.dataset.f] = el.value; persistDrafts(); syncDraft(S.date, pl.key);
  } else if (el.id === "m-text") lsSet("bj-mtext", el.value);
  else if (el.id === "fb-text") lsSet("bj-fbtext", el.value);
  else if (el.dataset.mf) { S.mfill = {...(S.mfill || {}), [el.dataset.mf]: el.value}; }
});
document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.id === "lift-sel") { S.liftSel = el.value; lsSet("bj-lift", el.value); render(); return; }
  if (el.name === "mtype") { S.mtype = el.value; return; }
  if (el.dataset.mtypeOf) {
    const id = el.dataset.mtypeOf, v = el.value;
    updateDay(S.date, d => { const m = d.meals.find(x => x.id === id); if (m) m.type = v; }).then(() => toast(`已改成${v}`)).catch(()=>{});
    return;
  }
  if (el.dataset.more && el.files?.[0]) { addMorePhoto(S.date, el.dataset.more, el.files[0], el.dataset.tag || "其他"); return; }
  if (el.id === "m-photo" && el.files?.[0]) {
    const have = S.pendingPhotos || [];
    S.pendingPhotos = [...have, ...[...el.files].slice(0, 4 - have.length).map(file => ({file, url:URL.createObjectURL(file)}))];
    if (have.length + el.files.length > 4) toast("一餐最多 4 张照片");
    const keep = $("#m-text")?.value; render(); if (keep != null && $("#m-text")) $("#m-text").value = keep;
  } else if (el.dataset.cu) {
    const [i, f] = el.dataset.cu.split("."), val = el.value;
    updateDay(S.date, d => { const e = d.custom?.ex?.[+i]; if (e) e[f] = f === "name" ? val.trim() : (val === "" ? "" : +val); }).catch(()=>{});
  } else if (el.dataset.meal) {
    const id = el.dataset.meal, k = el.dataset.k, val = el.value === "" ? null : Math.round(+el.value);
    updateDay(S.date, d => { const m = d.meals.find(x => x.id === id); if (m) m.est = {...(m.est||{}), [k]: val, ...(m.est?.by ? {} : {by:"manual"})}; }).catch(()=>{});
  }
});
document.addEventListener("toggle", ev => {
  const el = ev.target; if (!el.dataset?.cue) return;
  S.openCues = S.openCues || new Set();
  el.open ? S.openCues.add(el.dataset.cue) : S.openCues.delete(el.dataset.cue);
}, true);
document.addEventListener("submit", ev => { if (ev.target.id === "setup") { ev.preventDefault(); submitSetup(ev.target); } });

/* ============ 启动 ============ */
(async function boot(){
  const use = n => (window.ritual?.use ? window.ritual.use(n).catch(() => null) : Promise.resolve(null));
  const [db, assets, sample, comments, user] = await Promise.all([use("db"), use("assets"), use("sample"), use("comments"), use("user")]);
  S.comments = comments;
  const me = user ? await user.me().catch(() => null) : null;
  if (!db || !me?.id) {
    $("#app").innerHTML = '<div class="banner">暂时无法读取账号，请检查网络后刷新，或<a href="/login.html">重新登录</a>。未保存任何记录。</div>';
    return;
  }
  storageUser = me.id;
  S.tab = lsGet("bj-tab", "today");
  S.drafts = lsGet("bj-drafts", {});
  S.hostUser = me;
  S.uid = me?.id || null; S.owner = !!(me?.isOwner || me?.canEdit); // 主人或编辑者（admin）才能读旧的共享根路径
  S.cloud = !!(db && S.uid); S.raw = S.cloud ? db : null; S.assets = assets; S.sample = sample;
  S.noId = !!db && !S.uid;
  S.store = mkCloud(db, `data/users/${S.uid}/app`);
  let lim = null;
  if (sample) { lim = await sample.limits().catch(e => ({err:String(e?.code||e)})); S.imgOK = lim?.images ? true : (lim && !lim.err ? false : null); }
  S.serverSample = sample; S.serverImgOK = S.imgOK;
  applyAI();
  // 诊断：记下这次打开时平台给的能力，方便排查看图估算
  if (S.cloud) { try { S.store.set("meta/diag", {at:new Date().toISOString(), ua:navigator.userAgent.slice(0,200), sample:!!sample, ai:S.aiProv, limits:lim ? JSON.parse(JSON.stringify(lim)) : null, assets:!!assets, comments:!!comments, owner:S.owner}).catch(()=>{}); } catch {} }
  await loadAll();
  if (S.cloud) { try { S.account = await S.store.get("meta/account"); } catch {} }
  S.ready = true; render();
  rescueDrafts();
})();
// 找回这台设备上填了但没点保存的训练
function rescueDrafts(){
  if (!S.profile) return;
  const found = [];
  for (const [k, d] of Object.entries(S.drafts || {})) {
    if (!d?.exercises?.some(e => e.sets?.some(t => t.r !== "" || t.w !== ""))) continue;
    const date = k.split("|")[0];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || S.days[date]?.workout?.done) continue;
    found.push(date);
    updateDay(date, x => { if (!x.workout?.done && !x.workoutDraft) x.workoutDraft = {...clone(d), key:d.key, updatedAt:new Date().toISOString()}; }, {quiet:true, silent:true}).catch(() => {});
  }
  if (found.length) toast(`找到 ${[...new Set(found)].map(d => fmtDate(d).split(" ")[0]).join("、")} 填了但没保存的训练，打开那天点“完成训练，保存”即可`, 8000);
}
</script>
